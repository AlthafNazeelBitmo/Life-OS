include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  # Generated sources are NOT excluded on purpose. Excluding them once hid a
  # real compile error: `app_database.g.dart` referenced enum types that were
  # only imported by `tables.dart`, and the analyzer stayed silent while the
  # compiler failed. Generated files carry their own ignore_for_file headers,
  # so analysing them costs nothing and catches this class of bug.
  exclude:
    - "build/**"
  errors:
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error
    todo: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_unnecessary_containers
    - await_only_futures
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
